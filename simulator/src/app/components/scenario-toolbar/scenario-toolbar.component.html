<nz-space nzAlign="center" class="toolbar">
  <nz-select
    *nzSpaceItem
    class="scenario-select"
    [(ngModel)]="selectedId"
    (ngModelChange)="onScenarioChange($event)"
    nzPlaceHolder="Scenario"
  >
    @for (s of scenarios; track s.id) {
      <nz-option [nzValue]="s.id" [nzLabel]="scenarioLabel(s)" />
    }
  </nz-select>

  <button *nzSpaceItem nz-button nzType="primary" type="button" (click)="start()">
    <span nz-icon nzType="caret-right"></span>
    Run
  </button>
  <button *nzSpaceItem nz-button type="button" (click)="pause()">
    <span nz-icon nzType="pause"></span>
    Pause
  </button>
  <button *nzSpaceItem nz-button type="button" (click)="step()">
    <span nz-icon nzType="step-forward"></span>
    Step
  </button>
  <button *nzSpaceItem nz-button nzDanger type="button" (click)="reset()">
    <span nz-icon nzType="reload"></span>
    Reset
  </button>

  @if (snapshot$ | async; as snap) {
    <nz-tag *nzSpaceItem [nzColor]="snap.running ? 'green' : 'default'">
      {{ snap.running ? "Running" : "Paused" }} · t={{ snap.simTimeSec | number: "1.1-1" }}s
    </nz-tag>
  }
</nz-space>
